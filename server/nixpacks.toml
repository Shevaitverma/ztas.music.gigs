# ============================================
# Nixpacks build configuration — ZTS Music API (Bun + Elysia)
# ============================================
# Why this file exists:
#   The platform was auto-detecting a Node build and pinning Node.js 18, which
#   has reached End-Of-Life and was removed from nixpkgs — breaking the build
#   ("error: Node.js 18.x has reached End-Of-Life and has been removed").
#
#   This service actually runs on Bun (it uses Bun.env and `bun src/index.ts`),
#   so we pin Bun explicitly plus a supported Node (20.x) for any tooling/
#   postinstall scripts that expect node on PATH. Bun runs TypeScript directly,
#   so no separate build/transpile step is required.

# ⚠️  RUNTIME VERSION IS NOT PINNED ON THIS PATH.
#   `nixPkgs = ["bun"]` resolves to whatever Bun the platform's nixpkgs snapshot
#   carries, so this deploy path can change runtime version without a code
#   change. That has already caused a boot-time crash once (bson + node:v8),
#   and it is the one gap the Dockerfile pin does NOT cover.
#
#   To close it, pin the nixpkgs snapshot so every package version is fixed:
#     [phases.setup]
#     nixpkgsArchive = "<nixpkgs commit sha>"
#   Pick the sha whose Bun matches server/Dockerfile (currently 1.3.14) and bump
#   both together. Until then, prefer the Dockerfile path for production.

[phases.setup]
nixPkgs = ["bun", "nodejs_20"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

# Build phase explicitly EMPTY — a comment is not enough.
#
# Nixpacks auto-detects a `build` script in package.json and runs it unless a
# build phase is declared. That is what broke this deploy:
#
#   bun build src/index.ts --outdir dist --target bun --minify
#   error: Could not resolve "@firebase/app"
#     at node_modules/@firebase/database-compat/dist/index.standalone.js:15
#
# firebase-admin ships prebuilt standalone bundles that `require()` sibling
# @firebase/* packages at runtime; re-bundling them with `--target bun` cannot
# resolve those, and bundling buys nothing here because Bun executes TypeScript
# natively. The Dockerfile copies `src/` and runs `bun run start` for the same
# reason — this keeps both deploy paths on the identical artifact.
#
# The `build` script has been removed from package.json so this cannot regress.
[phases.build]
cmds = []

[start]
cmd = "bun run start"
